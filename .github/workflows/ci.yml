name: ci

# Unit/lint live in scripts/ci-local.sh (lefthook pre-push). This workflow is
# linux GreenMail + image, plus a full suite on pull_request (we cannot assume
# a contributor ran the hook). Operator pushes do not start it.
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      include-unit:
        description: Also run lint and unit tests (lefthook already does this)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, typecheck, test
    if: ${{ github.event_name == 'pull_request' || inputs.include-unit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          tags: ghcr.io/bitfloo/mailoo:ci

  integration:
    name: Integration tests
    # GreenMail on linux. A dispatch-only job hid PR regressions; this job
    # stays on pull_request (and dispatch), not on operator push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration

  public-log:
    # Lefthook checks one commit message on a machine that installed the hook.
    # This job checks the pull request range, title, and body.
    name: Public commit and pull request text
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUBLIC_GIT_EXTRA_FORBIDDEN: ${{ vars.PUBLIC_GIT_EXTRA_FORBIDDEN }}
        run: bash scripts/check-public-git-log.sh --range "origin/${BASE_REF}..${HEAD_SHA}"
      - env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PUBLIC_GIT_EXTRA_FORBIDDEN: ${{ vars.PUBLIC_GIT_EXTRA_FORBIDDEN }}
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr-text"
          bash scripts/check-public-git-log.sh --file "$RUNNER_TEMP/pr-text"
