name: ci

# Unit/lint live in scripts/ci-local.sh (lefthook pre-push). This workflow is
# linux GreenMail + image, plus a full suite on pull_request (we cannot assume
# a contributor ran the hook). Operator pushes do not start it.
on:
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      include-unit:
        description: Also run lint and unit tests (lefthook already does this)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check, typecheck, test
    if: ${{ github.event_name == 'pull_request' || inputs.include-unit }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ghcr.io/bitfloo/mailoo:ci

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:integration
