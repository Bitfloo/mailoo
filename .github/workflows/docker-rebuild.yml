name: docker-rebuild

# Rebuild GHCR from the Dockerfiles (base-image digest bumps). Not a test suite.
# Release images are linux/amd64 and linux/arm64. A runner-arch build would
# replace those public tags with a single architecture.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: docker-rebuild
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rebuild:
    name: Rebuild GHCR image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          set -euo pipefail
          V="$(jq -r .version package.json)"
          if [[ -z "$V" || "$V" == "null" ]]; then
            echo "package.json version is empty" >&2
            exit 1
          fi
          MAJOR="${V%%.*}"
          MINOR="${V#*.}"
          MINOR="${MINOR%%.*}"
          IMAGE="ghcr.io/bitfloo/mailoo"
          # Same tag names as .goreleaser.yaml. sha-* stays on the release
          # commit: this workflow builds the default branch, not that commit.
          bookworm=(
            "${IMAGE}:${V}"
            "${IMAGE}:${V}-bookworm"
            "${IMAGE}:${MAJOR}.${MINOR}"
            "${IMAGE}:${MAJOR}.${MINOR}-bookworm"
            "${IMAGE}:${MAJOR}"
            "${IMAGE}:${MAJOR}-bookworm"
            "${IMAGE}:bookworm"
          )
          alpine=(
            "${IMAGE}:${V}-alpine"
            "${IMAGE}:${MAJOR}.${MINOR}-alpine"
            "${IMAGE}:${MAJOR}-alpine"
          )
          if [[ "$V" != *-* ]]; then
            bookworm+=("${IMAGE}:latest")
            alpine+=("${IMAGE}:alpine")
          fi
          join() { local IFS=,; echo "$*"; }
          echo "bookworm_tags=$(join "${bookworm[@]}")" >> "$GITHUB_OUTPUT"
          echo "alpine_tags=$(join "${alpine[@]}")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.bookworm_tags }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.alpine
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.alpine_tags }}
