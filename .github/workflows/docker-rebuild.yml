name: docker-rebuild

# Rebuild GHCR from the Dockerfile (base-image patches). Not a test suite.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: docker-rebuild
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  rebuild:
    name: Rebuild GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          V="$(jq -r .version package.json)"
          TAGS="ghcr.io/bitfloo/mailoo:${V},ghcr.io/bitfloo/mailoo:bookworm"
          if [[ "$V" != *-* ]]; then
            TAGS="${TAGS},ghcr.io/bitfloo/mailoo:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
