name: docker-rebuild

# Rebuild GHCR from the Dockerfile (base-image patches). Not a test suite.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: docker-rebuild
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  rebuild:
    name: Rebuild GHCR image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          V="$(jq -r .version package.json)"
          TAGS="ghcr.io/bitfloo/mailoo:${V},ghcr.io/bitfloo/mailoo:bookworm"
          if [[ "$V" != *-* ]]; then
            TAGS="${TAGS},ghcr.io/bitfloo/mailoo:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
