name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release (e.g. 1.2.3) — used when
          triggering manually without a git tag
        required: false
      skip-npm:
        description: Skip npm publish (e.g. already published)
        type: boolean
        default: false

# Workflow token is read-only. Each job restates the scopes it already uses.
permissions:
  contents: read

jobs:
  npm:
    name: Publish to npm
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip-npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Trusted publishing (OIDC, npm >= 11.5.1): npmjs.com trusts Bitfloo/mailoo
      # release.yml, so there is no token to leak or expire, and provenance is
      # attached automatically. pnpm does not do this OIDC exchange, hence npm.
      # npm ci checks the lockfile integrity. A version tag is not a hash.
      - run: npm ci --ignore-scripts
        working-directory: .github/npm-cli
      - run: .github/npm-cli/node_modules/.bin/npm publish --access public

  mcp:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: [npm]
    if: always() && (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Release assets can be re-uploaded, so the hash is pinned here.
      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher_linux_amd64.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz"
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Set version in server.json
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash scripts/bump-server-json-version.sh "${INPUT_VERSION:-${GITHUB_REF#refs/tags/v}}"
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      # npm can 404 a version that was just published. The registry turns that into
      # a 400 and says to wait and retry. Only that message is retried, so an auth
      # error or a bad manifest still fails this job. Docker needs the success.
      - name: Publish to MCP Registry
        run: |
          log=$(mktemp)
          trap 'rm -f "$log"' EXIT
          attempts=6
          pause=20
          for ((attempt = 1; attempt <= attempts; attempt++)); do
            status=0
            ./mcp-publisher publish >"$log" 2>&1 || status=$?
            cat "$log"
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if ! grep -F -q "was not found (status: 404). A newly published release can take a moment to appear on the registry. Wait and retry" "$log"; then
              exit "$status"
            fi
            if [[ "$attempt" -eq "$attempts" ]]; then
              echo "npm has not shown this version after ${attempts} attempts" >&2
              exit "$status"
            fi
            echo "npm has not propagated this version yet (attempt ${attempt}/${attempts}); retrying in ${pause}s" >&2
            sleep "$pause"
          done

  docker:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: [npm, mcp]
    if: always() && (needs.npm.result == 'success' || needs.npm.result == 'skipped') && needs.mcp.result == 'success'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The release body is the CHANGELOG.md section cog bump wrote before tagging.
      # A release of omitted commit types only has an empty section, so the install
      # lines are always appended.
      - name: Write release notes
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF#refs/tags/v}}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v head="## [v${version}](" 'index($0, head) == 1 { found = on = 1; next } on && $0 == "- - -" { exit } on; END { if (!found) { print "no CHANGELOG.md section for " head > "/dev/stderr"; exit 1 } }' CHANGELOG.md > "$notes"
          # shellcheck disable=SC2016 # the backticks are Markdown code spans
          printf '\n**Install:** `npx -y @bitfloo/mailoo@latest` · `docker pull ghcr.io/bitfloo/mailoo:%s` (or `%s-alpine`)\n\nFull history: [CHANGELOG.md](https://github.com/bitfloo/mailoo/blob/v%s/CHANGELOG.md)\n' \
            "$version" "$version" "$version" >> "$notes"
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  aliases:
    name: Publish npm aliases
    runs-on: ubuntu-latest
    needs: [npm]
    if: always() && (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
        working-directory: .github/npm-cli
      # Nothing waits for this job, so an alias that cannot be published (no trusted
      # publisher yet, a name taken) leaves npm, the MCP Registry and Docker alone.
      # The script runs on the same hash-pinned npm as the npm job (>= 11.5.1 is
      # what the OIDC exchange needs), so that one goes first on PATH.
      - run: PATH="$PWD/.github/npm-cli/node_modules/.bin:$PATH" bash scripts/publish-npm-aliases.sh
        env:
          NPM_JOB_RESULT: ${{ needs.npm.result }}
