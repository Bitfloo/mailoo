name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release (e.g. 1.2.3) — used when
          triggering manually without a git tag
        required: false
      skip-npm:
        description: Skip npm publish (e.g. already published)
        type: boolean
        default: false

jobs:
  npm:
    name: Publish to npm
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.skip-npm }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Trusted publishing (OIDC, npm >= 11.5.1): npmjs.com trusts Bitfloo/mailoo
      # release.yml, so there is no token to leak or expire, and provenance is
      # attached automatically. pnpm 9 cannot do the OIDC exchange, hence npm.
      - run: npm install -g npm@latest
      - run: npm publish --access public

  mcp:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: [npm]
    if: always() && (needs.npm.result == 'success' || needs.npm.result == 'skipped')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Install mcp-publisher
        run: |
          OS="$(uname -s | tr '[:upper:]' '[:lower:]')"
          ARCH="$(uname -m)"
          ARCH="${ARCH/x86_64/amd64}"
          ARCH="${ARCH/aarch64/arm64}"
          BASE="https://github.com/modelcontextprotocol"
          BASE="${BASE}/registry/releases/latest/download"
          curl -L \
            "${BASE}/mcp-publisher_${OS}_${ARCH}.tar.gz" \
            | tar xz mcp-publisher
      - name: Set version in server.json
        run: |
          VERSION="${{ inputs.version || '' }}"
          if [[ -z "$VERSION" ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          bash scripts/bump-server-json-version.sh "$VERSION"
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  docker:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: [npm, mcp]
    if: always() && (needs.npm.result == 'success' || needs.npm.result == 'skipped') && needs.mcp.result == 'success'
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
