<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-label="Mailoo MCP Server Architecture">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="accentEmerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Header Banner -->
  <rect x="24" y="18" width="912" height="44" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <circle cx="48" cy="40" r="8" fill="url(#accentBlue)" />
  <text x="66" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Mailoo (@bitfloo/mailoo)</text>
  <text x="276" y="45" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#94a3b8">Email, Calendar, Reminders &amp; ManageSieve MCP Architecture</text>
  <rect x="786" y="28" width="136" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1" />
  <text x="854" y="44" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" fill="#6ee7b7">MCP server</text>

  <!-- Column 1: MCP Clients & LLM Tiers -->
  <rect x="24" y="78" width="210" height="320" rx="12" fill="url(#coreGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="40" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="0.5">MCP CLIENTS &amp; LLMS</text>

  <!-- Box 1.1: Frontier LLMs -->
  <rect x="38" y="118" width="182" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="50" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">Frontier Agents (Full 57)</text>
  <text x="50" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Claude, Cursor, Windsurf,</text>
  <text x="50" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">VS Code, Zed, Goose</text>

  <!-- Box 1.2: Small / Local LLMs -->
  <rect x="38" y="204" width="182" height="84" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="50" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#34d399">Small LLMs (3B&#8211;8B Ready)</text>
  <text x="50" y="242" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">llama.cpp GBNF grammars</text>
  <text x="50" y="258" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">core / minimal toolsets</text>
  <text x="50" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#94a3b8">Parameter Aliases &amp; Schema Helpers</text>

  <!-- Box 1.3: Transports -->
  <rect x="38" y="300" width="182" height="82" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="50" y="320" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">MCP Transports</text>
  <text x="50" y="338" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#38bdf8">&#8226; stdio (EOF lifecycle)</text>
  <text x="50" y="355" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#38bdf8">&#8226; Streamable HTTP</text>
  <text x="50" y="371" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#64748b">Bearer Auth + Host Allowlist</text>

  <!-- Arrows Column 1 -> Column 2 -->
  <line x1="234" y1="155" x2="274" y2="155" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <line x1="234" y1="246" x2="274" y2="246" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  <line x1="234" y1="341" x2="274" y2="341" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- Column 2: Mailoo Core & Safety Controls -->
  <rect x="280" y="78" width="364" height="320" rx="12" fill="url(#coreGrad)" stroke="#4f46e5" stroke-width="1.5" />
  <text x="298" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#818cf8" letter-spacing="0.5">MAILOO CORE &amp; SAFETY CONTROLS</text>

  <!-- Box 2.1: Ergonomics & Schema Router -->
  <rect x="296" y="118" width="332" height="84" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="310" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">LLM Ergonomics &amp; Structured Output</text>
  <text x="310" y="156" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#94a3b8">&#8226; full 57/31 | core 19/10 | minimal 14/8</text>
  <text x="310" y="173" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#94a3b8">&#8226; default_account + account-name hints</text>
  <text x="310" y="190" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" fill="#94a3b8">&#8226; outputSchema + structuredContent + 20k guard</text>

  <!-- Box 2.2: Enforced operation controls -->
  <rect x="296" y="214" width="332" height="128" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.2" />
  <rect x="526" y="222" width="90" height="20" rx="10" fill="#064e3b" />
  <text x="571" y="236" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" fill="#34d399">ENFORCED</text>
  <text x="310" y="236" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#34d399">Operation Controls</text>
  <text x="310" y="255" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#cbd5e1">&#8226; SSRF &amp; DNS-rebinding checks (net.BlockList)</text>
  <text x="310" y="273" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#cbd5e1">&#8226; savePath: no symlinks, O_NOFOLLOW, 50 MiB cap</text>
  <text x="310" y="291" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#cbd5e1">&#8226; execFile argv arrays + TLS / STARTTLS</text>
  <text x="310" y="309" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#cbd5e1">&#8226; read_only, dryRun + per-account send limits</text>
  <text x="310" y="327" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" fill="#cbd5e1">&#8226; 0600 config + redacted JSONL write audit</text>

  <!-- Content labels do not enforce model behaviour. -->
  <rect x="296" y="348" width="332" height="34" rx="8" fill="#0f172a" stroke="#d97706" stroke-width="1" />
  <text x="310" y="361" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" fill="#fbbf24">UNTRUSTED markers; forged markers stripped</text>
  <text x="310" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#94a3b8">Content labels; model compliance is not enforced</text>

  <!-- Arrows Column 2 -> Column 3 -->
  <line x1="644" y1="138" x2="684" y2="138" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)" />
  <line x1="644" y1="210" x2="684" y2="210" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)" />
  <line x1="644" y1="282" x2="684" y2="282" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)" />
  <line x1="644" y1="354" x2="684" y2="354" stroke="#34d399" stroke-width="2" marker-end="url(#arrowEmerald)" />

  <!-- Column 3: Protocol Engines & Backends -->
  <rect x="690" y="78" width="246" height="320" rx="12" fill="url(#coreGrad)" stroke="#334155" stroke-width="1.5" />
  <text x="706" y="104" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#34d399" letter-spacing="0.5">SERVICES &amp; PROTOCOLS</text>

  <!-- Box 3.1: IMAP Engine -->
  <rect x="704" y="114" width="218" height="62" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="716" y="132" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">IMAP4rev2 / rev1 Engine</text>
  <text x="716" y="148" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Selective MIME streaming, UID</text>
  <text x="716" y="163" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">windowing, IDLE real-time push</text>

  <!-- Box 3.2: SMTP & Scheduler -->
  <rect x="704" y="184" width="218" height="62" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="716" y="202" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">SMTP &amp; Delayed Scheduler</text>
  <text x="716" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Threaded replies, Sent APPEND,</text>
  <text x="716" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">OAuth2 (Google / Microsoft)</text>

  <!-- Box 3.3: ManageSieve -->
  <rect x="704" y="254" width="218" height="62" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="716" y="272" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">ManageSieve (RFC 5804)</text>
  <text x="716" y="288" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Server-side filter scripts,</text>
  <text x="716" y="303" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">STARTTLS + capability checks</text>

  <!-- Box 3.4: AI Triage, Calendar & Reminders -->
  <rect x="704" y="324" width="218" height="62" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
  <text x="716" y="342" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#f1f5f9">AI Triage, Calendar &amp; Tasks</text>
  <text x="716" y="358" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">System One hooks, .ics parsing,</text>
  <text x="716" y="373" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#94a3b8">Apple Calendar &amp; Reminders</text>
</svg>
