# Smithery configuration — https://smithery.ai/docs/build
# Lists mailoo on the Smithery MCP marketplace.
# `@bitfloo/mailoo` is not on npmjs yet — launch the built clone, not npx.
# Config is stored locally via `node dist/main.js account add`; no runtime secrets here.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: "node",
      args: ["dist/main.js", "stdio"]
    })
