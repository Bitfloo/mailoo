# Smithery configuration — https://smithery.ai/docs/build
# Lists mailoo on the Smithery MCP marketplace.
# Config is stored locally via `mailoo account add`; no runtime secrets needed here.
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    additionalProperties: false
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@bitfloo/mailoo", "stdio"]
    })
