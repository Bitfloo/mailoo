# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Mailoo — GoReleaser configuration (Node.js/TypeScript; Docker via Dockerfile)
version: 2
project_name: mailoo

builds:
  - skip: true

dockers_v2:
  - id: mailoo-debian
    dockerfile: Dockerfile
    extra_files:
      - src/
      - package.json
      - pnpm-lock.yaml
      - tsconfig.build.json
      - tsconfig.json
      - biome.json
      - LICENSE
      - COPYING
      - NOTICE
    images:
      - ghcr.io/bitfloo/mailoo
    tags:
      - "{{ .Version }}"
      - "{{ .Version }}-bookworm"
      - "{{ .Major }}.{{ .Minor }}"
      - "{{ .Major }}.{{ .Minor }}-bookworm"
      - "{{ .Major }}"
      - "{{ .Major }}-bookworm"
      - bookworm
      - "{{ if not .Prerelease }}latest{{ end }}"
      - "sha-{{ .ShortCommit }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: Mailoo
      org.opencontainers.image.description: "Mailoo — IMAP/SMTP MCP server. Multi-account, per-folder profiles."
      org.opencontainers.image.url: "https://github.com/bitfloo/mailoo"
      org.opencontainers.image.source: "https://github.com/bitfloo/mailoo"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: LGPL-3.0-or-later
      org.opencontainers.image.vendor: Bitfloo
    annotations:
      org.opencontainers.image.description: "Mailoo — IMAP/SMTP MCP server. Multi-account, per-folder profiles."
      org.opencontainers.image.source: "https://github.com/bitfloo/mailoo"
      org.opencontainers.image.licenses: LGPL-3.0-or-later
      org.opencontainers.image.created: "{{ .Date }}"

  - id: mailoo-alpine
    dockerfile: Dockerfile.alpine
    extra_files:
      - src/
      - package.json
      - pnpm-lock.yaml
      - tsconfig.build.json
      - tsconfig.json
      - biome.json
      - LICENSE
      - COPYING
      - NOTICE
    images:
      - ghcr.io/bitfloo/mailoo
    tags:
      - "{{ .Version }}-alpine"
      - "{{ .Major }}.{{ .Minor }}-alpine"
      - "{{ .Major }}-alpine"
      - "{{ if not .Prerelease }}alpine{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: Mailoo
      org.opencontainers.image.description: "Mailoo — IMAP/SMTP MCP server. Multi-account, per-folder profiles."
      org.opencontainers.image.url: "https://github.com/bitfloo/mailoo"
      org.opencontainers.image.source: "https://github.com/bitfloo/mailoo"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.licenses: LGPL-3.0-or-later
      org.opencontainers.image.vendor: Bitfloo
    annotations:
      org.opencontainers.image.description: "Mailoo — IMAP/SMTP MCP server. Multi-account, per-folder profiles."
      org.opencontainers.image.source: "https://github.com/bitfloo/mailoo"
      org.opencontainers.image.licenses: LGPL-3.0-or-later
      org.opencontainers.image.created: "{{ .Date }}"

release:
  github:
    owner: bitfloo
    name: mailoo
  make_latest: true
  draft: false
  # Replace notes if a GitHub Release for this tag already exists.
  mode: replace

# GitHub-generated release notes (not the cocogitto CHANGELOG).
# npm publish and MCP registry stay in release.yml.
changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^Merge"
      - "^chore(deps)"
      - "^ci:"
