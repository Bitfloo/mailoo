# ==============================================================================
# Lefthook Git Hooks Configuration
# ==============================================================================
# Docs: https://lefthook.dev/configuration/
#
# Install hooks: pnpm lefthook install
#
# pre-push runs scripts/ci-local.sh (unit always; GreenMail when Docker is up).
# GitHub Actions does not repeat that on operator pushes.
# ==============================================================================

pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{ts,tsx,js,jsx,json,jsonc}'
      exclude: '*lock*'
      run: npx biome check --write {staged_files}
      stage_fixed: true
    eslint:
      glob: 'src/**/*.{ts,tsx,js,jsx}'
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    typecheck:
      run: npx tsc --noEmit
    actionlint:
      glob: '.github/workflows/*.{yml,yaml}'
      run: actionlint {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: |
        cog verify --file {1} 2>/dev/null || {
          echo ""
          echo "❌ Invalid commit message format"
          echo ""
          echo "Expected: <type>(<scope>): <description>"
          echo "Example:  feat(imap): add thread reconstruction"
          echo ""
          echo "Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
          echo ""
          exit 1
        }
        bash scripts/check-public-git-log.sh --file {1}

pre-push:
  commands:
    ci-local:
      run: bash scripts/ci-local.sh
