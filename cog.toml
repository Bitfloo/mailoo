# ==============================================================================
# Cocogitto Configuration for mailoo
# ==============================================================================
# Docs: https://docs.cocogitto.io/reference/config.html
#
# Releases use `cog bump --patch`. cog 7 `--auto` bumps the minor of a 0.x
# version for any `feat` commit (0.3.1 -> 0.4.0), whatever the commit types set.
# Labels like 0.1.001 map to 0.1.1 (SemVer rejects leading zeros).
# Quick Commands:
#   cog bump --patch         # Release: next patch version
#   cog bump --minor         # Deliberate new minor line only
#   cog check                # Verify commit history
#   cog log                  # View conventional commit log
#   cog changelog            # Generate changelog
# ==============================================================================

# ------------------------------------------------------------------------------
# Global Settings
# ------------------------------------------------------------------------------
# Version from the latest Mailoo tag only. Upstream email-mcp tags must not be
# restored — cog would treat them as Mailoo releases.
from_latest_tag = true
ignore_merge_commits = true
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
branch_whitelist = ["develop", "release/**", "hotfix/**"]
skip_ci = "[skip ci]"
skip_untracked = false
tag_prefix = "v"

# cog has written the CHANGELOG.md entry when these run, and commits what they leave.
pre_bump_hooks = [
    "pnpm check",
    "pnpm build",
    "npm pkg set version={{version}}",
    "bash scripts/bump-server-json-version.sh {{version}}",
    "bash scripts/bump-readme-image-tag.sh {{version}}",
    "bash scripts/tidy-changelog-entry.sh {{latest}} {{version}}",
    "git add package.json server.json README.md",
]

# develop takes changes only through a pull request, so the bump commit goes up
# on its own branch, and the tag waits for the merge (CONTRIBUTING.md, Releases).
post_bump_hooks = [
    "git push origin HEAD:refs/heads/chore/v{{version}}",
]

# ------------------------------------------------------------------------------
# Git Hooks
# ------------------------------------------------------------------------------
# Git hooks are managed by Lefthook (see lefthook.yml).
# Do NOT run `cog install-hook` — Lefthook handles commit-msg and pre-push.

# ------------------------------------------------------------------------------
# Commit Types
# ------------------------------------------------------------------------------
[commit_types]
feat = { changelog_title = "✨ Features" }
fix = { changelog_title = "🐛 Bug Fixes" }
perf = { changelog_title = "⚡ Performance" }
refactor = { changelog_title = "♻️ Refactoring" }
docs = { changelog_title = "📚 Documentation" }
build = { changelog_title = "Build", omit_from_changelog = true }
ci = { changelog_title = "CI", omit_from_changelog = true }
test = { changelog_title = "Tests", omit_from_changelog = true }
style = { changelog_title = "Styles", omit_from_changelog = true }
chore = { changelog_title = "Chores", omit_from_changelog = true }
revert = { changelog_title = "⏪ Reverts" }

# ------------------------------------------------------------------------------
# Changelog Configuration
# ------------------------------------------------------------------------------
[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "bitfloo"
repository = "mailoo"
authors = [
    { signature = "58808821+codefuturist@users.noreply.github.com", username = "codefuturist" },
]
