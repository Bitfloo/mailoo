# ==============================================================================
# Cocogitto Configuration for mailoo
# ==============================================================================
# Docs: https://docs.cocogitto.io/reference/config.html
#
# Patch-only 0.1.x: operator labels like 0.1.001 map to 0.1.1 (SemVer rejects leading zeros).
# Quick Commands:
#   cog bump --auto          # Auto-bump based on commit types (patch-only while on 0.1.x)
#   cog bump --minor         # Manual minor bump
#   cog bump --patch         # Manual patch bump
#   cog check                # Verify commit history
#   cog log                  # View conventional commit log
#   cog changelog            # Generate changelog
# ==============================================================================

# ------------------------------------------------------------------------------
# Global Settings
# ------------------------------------------------------------------------------
# Version from the latest Mailoo tag only. Upstream email-mcp tags (v0.2.x)
# must not be restored — cog would treat them as Mailoo releases.
from_latest_tag = true
ignore_merge_commits = true
ignore_fixup_commits = true
disable_changelog = false
disable_bump_commit = false
branch_whitelist = ["main", "develop", "release/**", "hotfix/**"]
skip_ci = "[skip ci]"
skip_untracked = false
tag_prefix = "v"

pre_bump_hooks = [
    "pnpm check",
    "pnpm build",
    "npm pkg set version={{version}}",
    "bash scripts/bump-server-json-version.sh {{version}}",
    "git add package.json server.json",
]

post_bump_hooks = [
    "git push origin HEAD",
    "git push origin v{{version}}",
]

# ------------------------------------------------------------------------------
# Git Hooks
# ------------------------------------------------------------------------------
# Git hooks are managed by Lefthook (see lefthook.yml).
# Do NOT run `cog install-hook` — Lefthook handles commit-msg and pre-push.

# ------------------------------------------------------------------------------
# Commit Types
# ------------------------------------------------------------------------------
[commit_types]
feat = { changelog_title = "✨ Features", bump_patch = true }
fix = { changelog_title = "🐛 Bug Fixes" }
perf = { changelog_title = "⚡ Performance" }
refactor = { changelog_title = "♻️ Refactoring" }
docs = { changelog_title = "📚 Documentation" }
build = { changelog_title = "Build", hidden = true }
ci = { changelog_title = "CI", hidden = true }
test = { changelog_title = "Tests", hidden = true }
style = { changelog_title = "Styles", hidden = true }
chore = { changelog_title = "Chores", hidden = true }
revert = { changelog_title = "⏪ Reverts" }

# ------------------------------------------------------------------------------
# Changelog Configuration
# ------------------------------------------------------------------------------
[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "bitfloo"
repository = "mailoo"
authors = [
    { signature = "58808821+codefuturist@users.noreply.github.com", username = "codefuturist" },
]

# ------------------------------------------------------------------------------
# Bump Profiles
# ------------------------------------------------------------------------------
[bump_profiles]

[bump_profiles.release]
pre_bump_hooks = ["pnpm check", "pnpm build", "npm pkg set version={{version}}", "bash scripts/bump-server-json-version.sh {{version}}", "git add package.json server.json"]
post_bump_hooks = [
    "git push origin HEAD",
    "git push origin v{{version}}",
]

[bump_profiles.hotfix]
pre_bump_hooks = ["pnpm check", "npm pkg set version={{version}}", "bash scripts/bump-server-json-version.sh {{version}}", "git add package.json server.json"]
post_bump_hooks = [
    "git push origin HEAD",
    "git push origin v{{version}}",
]
